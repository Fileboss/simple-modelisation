# Example deployment: one container, Shared Projects kept in a named volume.
services:
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - data:/data
    # The server needs no capability: it listens on an unprivileged port and
    # writes only to /data, which belongs to its user.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

volumes:
  data:
