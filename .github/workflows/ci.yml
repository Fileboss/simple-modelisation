# Generated by sdlc (ci module). CI calls the Makefile, never tools directly.
# Actions are pinned by commit; Dependabot keeps the pins current.
name: ci
on:
  push:
    branches: [main]
  pull_request:
# Read-only, whatever the repository's default: CI only reads the code.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ./package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./.nvmrc
      - run: pnpm install --frozen-lockfile --dir ./
      - run: make lint test
