server {
	listen 80;
	root /usr/share/nginx/html;

	# Client-side routes (/p/<id>) all serve the app.
	location / {
		try_files $uri /index.html;
	}

	# index.html points at hashed assets: revalidate it so a deploy is picked up.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}
}
